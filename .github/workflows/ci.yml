name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. ESLint
      - name: Lint
        run: pnpm lint

      # 6. Generate Next.js types
      - name: Generate Next.js types
        run: pnpm typegen

      # 7. TypeScript
      - name: Type check
        run: pnpm type-check

      # 8. Next.js build
      - name: Build
        run: pnpm build
